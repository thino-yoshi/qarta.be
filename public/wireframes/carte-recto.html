<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Carte Physique Qarta — Recto</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    @page { size: A4 portrait; margin: 10mm; }
    body {
      font-family: 'Sora', sans-serif;
      background: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card { position: relative; overflow: hidden; flex-shrink: 0; border: 0.3mm solid rgba(74,158,255,.3); }
    .grid-bg {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(74,158,255,.12) 0.15mm, transparent 0.15mm),
        linear-gradient(90deg, rgba(74,158,255,.12) 0.15mm, transparent 0.15mm);
    }
    @media print {
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // ── Valeurs originales (carte 220×220px de référence) ──
    const BASE = 220;   // px
    const O = {
      padTop:    18,   padSide:   16,   padBot:    14,
      logoSm:    22,   logoLg:    44,
      qrBox:    116,   qrImg:    126,   qrBoxBr:   12,
      fontSm:    12,   fontLg:    28,
      fontScanne:11,   fontTag:   10.5,
      gapSm:      6,   gapLg:     10,   gapVerso:  14,
      strW1:     32,   strW2:     24,   strW3:     16,
      strH:     2.5,   strBot:    18,   strLeft:   16,  strGap: 5,
      sepW:      50,   lineW:     28,   lineH:    0.5,
      gridSize:  18,   br:        18,
      padTagSide:16,   scannGap:   5,
    };

    function sc(mm) {
      const f = mm / BASE;
      const r = {};
      for (const k in O) r[k] = +(O[k] * f).toFixed(4);
      return r;
    }

    function makeRecto(mm) {
      const v = sc(mm);
      return `
        <div class="card" style="

          justify-content:space-between;
          padding:${v.padTop}mm ${v.padSide}mm ${v.padBot}mm;

          <div class="grid-bg" style="border-radius:${v.br}mm; background-size:${v.gridSize}mm ${v.gridSize}mm;"></div>
